<html>
  <head>
    <meta charset="utf-8" />
    <title>GeoPKI Demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/demo/images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/demo/images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/demo/images/favicon-16x16.png"
    />

    <!-- PWA support-->
    <link rel="manifest" href="/demo/manifest.json" />

    <!-- what would a demo be without some styling :) -->
    <link rel="stylesheet" href="style.css" />

    <!-- https://leafletjs.com/examples/quick-start/ -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- font awesome icons-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- wasm script provided by golang, see https://golangbot.com/webassembly-using-go/ -->
    <script src="wasm_exec.js"></script>
    <!-- load javascript for making the site interactive -->
    <script src="demo.js"></script>
    <!-- javascript to initiate the web assembly -->
    <script>
      // custom code to load the web assembly file
      const go = new Go();

      WebAssembly.instantiateStreaming(
        fetch("geopki-client.wasm"),
        go.importObject
      ).then(async (result) => {
        go.run(result.instance);
        window.loadedWasm = true;
      });
    </script>
  </head>
  <body>
    <div id="map"></div>
    <a id="admin-link" href="admin.html" class="overlay" title="Certificate admin"
      >Admin</a
    >
    <div id="big-button-group" class="overlay">
      <!-- calls .locate on the leaflet map and queries the geopki server for that area -->
      <div
        id="current-location"
        class="big-button"
        title="query current GPS location"
        onclick="onCurrentLocation()"
      >
        <i class="fa-solid fa-location-dot"></i>
      </div>
      <!-- disables leaflets locating and queries the geopki server for the current center of the map -->
      <div
        id="current-map-location"
        class="big-button"
        title="query current map center"
        onclick="onCurrentMapLocation()"
      >
        <i class="fa-solid fa-map-location-dot"></i>
      </div>
    </div>
    <div id="altitude-slider" class="overlay">
      <input
        type="range"
        orient="vertical"
        min="-11000"
        max="21767"
        value="0"
        oninput="onAltitudeInput(this)"
      />
      <input
        type="number"
        min="-11000"
        max="21767"
        value="0"
        size="6"
        onchange="onAltitudeInput(this)"
      />
    </div>
    <!-- initialize map -->
    <script>
      /* load leaflet map */
      window.map = L.map("map").fitWorld();

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap",
      }).addTo(map);

      map.on("locationerror", onLocationError);
      map.on("locationfound", onLocationFound);
      map.locate({ watch: false, maxZoom: 19, enableHighAccuracy: true });
    </script>
  </body>
</html>
